<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">

  <!-- Внешняя бирюзовая окружность -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="#22d3ee" stroke-width="10"/>

  <!-- Внутренняя бирюзовая окружность -->
  <circle cx="150" cy="150" r="115" fill="none" stroke="#22d3ee" stroke-width="6"/>

  <!-- Тёмная область между окружностями -->
  <circle cx="150" cy="150" r="127" fill="none" stroke="#0f172a" stroke-width="18"/>

  <!-- VMS -->
  <text x="150" y="170"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial Black, sans-serif"
        font-size="102"
        font-weight="900"
        letter-spacing="-3">
    VMS
  </text>

  <!-- NC -->
  <text x="150" y="235"
        text-anchor="middle"
        fill="#22d3ee"
        font-family="Arial Black, sans-serif"
        font-size="82"
        font-weight="900"
        letter-spacing="-2">
    NC
  </text>

</svg>
