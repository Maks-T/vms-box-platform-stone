<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <style>

      .bg { fill: #0F172A; stroke: none; }
      .v-left { stop-color: #FFFFFF; }
      .v-right { stop-color: #00C8F8; }

      @media (prefers-color-scheme: light) {
      .bg { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1px; }
      .v-left { stop-color: #0F172A; }
      .v-right { stop-color: #009BBF; }
      }
    </style>

    <linearGradient id="vmsNcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="50%" class="v-left" />
      <stop offset="50%" class="v-right" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" class="bg" />

  <text x="16" y="24"
        text-anchor="middle"
        fill="url(#vmsNcGrad)"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="24"
        font-weight="900"
        letter-spacing="-1px">V</text>
</svg>